[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-local-jobs"
version = "0.1.0"
description = "A small LangChain local job search agent learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.4",
    "langgraph>=1.2.4",
    "langchain-openai>=1.2.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_local_jobs"]
